# gRPC-Web follows the Connect rules: a charset parameter on a JSON content type
# must be utf-8, and any other parameter must be ignored.
name: gRPC-Web JSON Content-Type Parameter Responses
mode: TEST_MODE_CLIENT
relevantProtocols:
  - PROTOCOL_GRPC_WEB
relevantCompressions:
  - COMPRESSION_IDENTITY
relevantCodecs:
  - CODEC_JSON
testCases:
  - request:
      testName: unary/charset-utf-8
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/grpc-web+json; charset=utf-8" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      text: '{"payload": {"data": "dGVzdCByZXNwb25zZQ=="}}'
                  - flags: 128
                    payload:
                      text: "grpc-status: 0\r\n"
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: unary/charset-utf-8-uppercase
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/grpc-web+json; charset=UTF-8" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      text: '{"payload": {"data": "dGVzdCByZXNwb25zZQ=="}}'
                  - flags: 128
                    payload:
                      text: "grpc-status: 0\r\n"
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: unary/charset-utf-8-quoted
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ 'application/grpc-web+json; charset="utf-8"' ]
              stream:
                items:
                  - flags: 0
                    payload:
                      text: '{"payload": {"data": "dGVzdCByZXNwb25zZQ=="}}'
                  - flags: 128
                    payload:
                      text: "grpc-status: 0\r\n"
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: unary/charset-utf-8-with-unknown-parameter
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/grpc-web+json; charset=utf-8; foo=bar" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      text: '{"payload": {"data": "dGVzdCByZXNwb25zZQ=="}}'
                  - flags: 128
                    payload:
                      text: "grpc-status: 0\r\n"
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: unary/unknown-parameter
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/grpc-web+json; foo=bar" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      text: '{"payload": {"data": "dGVzdCByZXNwb25zZQ=="}}'
                  - flags: 128
                    payload:
                      text: "grpc-status: 0\r\n"
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: unary/unsupported-charset
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/grpc-web+json; charset=iso-8859-1" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      text: '{"payload": {"data": "dGVzdCByZXNwb25zZQ=="}}'
                  - flags: 128
                    payload:
                      text: "grpc-status: 0\r\n"
    expectedResponse:
      error:
        # the response codec does not match the request codec
        code: CODE_INTERNAL
