# gRPC-Web follows the Connect rule that unknown content-type parameters must be
# ignored.
name: gRPC-Web Proto Content-Type Parameter Responses
mode: TEST_MODE_CLIENT
relevantProtocols:
  - PROTOCOL_GRPC_WEB
relevantCompressions:
  - COMPRESSION_IDENTITY
relevantCodecs:
  - CODEC_PROTO
testCases:
  - request:
      testName: unary/unknown-parameter
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/grpc-web+proto; foo=bar" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      binary_message:
                        "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryResponse"
                        payload:
                          data: "dGVzdCByZXNwb25zZQ=="
                  - flags: 128
                    payload:
                      text: "grpc-status: 0\r\n"
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ=="
