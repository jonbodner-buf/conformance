# gRPC follows the Connect rule that the charset parameter and unknown
# content-type parameters must be ignored for proto.
name: gRPC Proto Content-Type Parameter Requests
mode: TEST_MODE_SERVER
relevantProtocols:
  - PROTOCOL_GRPC
relevantCompressions:
  - COMPRESSION_IDENTITY
relevantCodecs:
  - CODEC_PROTO
testCases:
  - request:
      testName: unary/unknown-parameter
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            responseData: "dGVzdCByZXNwb25zZQ=="
      rawRequest:
        verb: POST
        uri: /connectrpc.conformance.v1.ConformanceService/Unary
        headers:
          - name: content-type
            value: [ "application/grpc+proto; foo=bar" ]
          - name: te
            value: [ "trailers" ]
        stream:
          items:
            - flags: 0
              payload:
                binary_message:
                  "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryRequest"
                  responseDefinition:
                    responseData: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: unary/charset-ignored
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            responseData: "dGVzdCByZXNwb25zZQ=="
      rawRequest:
        verb: POST
        uri: /connectrpc.conformance.v1.ConformanceService/Unary
        headers:
          - name: content-type
            value: [ "application/grpc+proto; charset=iso-8859-1" ]
          - name: te
            value: [ "trailers" ]
        stream:
          items:
            - flags: 0
              payload:
                binary_message:
                  "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryRequest"
                  responseDefinition:
                    responseData: "dGVzdCByZXNwb25zZQ=="
